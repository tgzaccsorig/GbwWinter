name: Build WinterWonderland

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract source
        run: |
          unzip -q GoodBadWorldWinter-Source-1.21.4.zip -d source

      - name: Locate Maven project
        run: find source -name pom.xml

      - name: Build
        run: |
          POM=$(find source -name pom.xml | head -n 1)
          test -n "$POM"
          mvn -f "$POM" clean package

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: WinterWonderland
          path: source/**/target/*.jar
          if-no-files-found: error
